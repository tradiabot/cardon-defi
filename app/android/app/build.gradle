plugins { id 'com.android.application' }

android {
    namespace 'com.defipoldot.trading'
    compileSdk 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'com.defipoldot.trading'
        minSdk 23
        targetSdk 34
        versionCode 58
        versionName '1.13.4'
        aaptOptions { ignoreAssetsPattern '!.svn:!*.scc:.*:!CVS:!thumbs.db:!*~' }
    }
    // «publica»: la app que se comparte; viene vacía y cada persona instala su propio agente.
    // «personal»: compilación propia con la dirección de tu agente en src/personal/assets/web/config.js (no se versiona).
    flavorDimensions 'edicion'
    productFlavors {
        publica {
            dimension 'edicion'
            applicationId 'com.cardondefi.app'
            versionCode 107
            versionName '1.0.7-piloto'
        }
        personal { dimension 'edicion' }
    }
    buildTypes {
        // Para repartir la APK fuera de una tienda: ./gradlew assemblePublicaRelease -PfirmaLocal
        // la firma con la llave de depuración de este equipo (sin ser depurable). Sin esa opción queda sin firmar,
        // que es lo que espera F-Droid para firmarla con su propia llave.
        release { if (project.hasProperty('firmaLocal')) signingConfig signingConfigs.debug }
    }
    // Sin el bloque de dependencias que AGP añade a la APK: no aporta nada y F-Droid lo rechaza.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.web3j:crypto:4.12.3'
}

android {
    packaging {
        resources {
            excludes += ['META-INF/DISCLAIMER', 'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'META-INF/DEPENDENCIES', 'META-INF/FastDoubleParser-LICENSE', 'META-INF/FastDoubleParser-NOTICE', 'META-INF/thirdparty-LICENSE']
        }
    }
}
